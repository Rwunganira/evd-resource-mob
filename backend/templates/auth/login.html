<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — WHO EVD Data Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --who-blue: #0093D5; --who-dark: #003D6B; }
    body {
      background: linear-gradient(135deg, var(--who-dark) 0%, #0066a1 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,.3);
    }
    .login-header {
      background: var(--who-dark);
      color: white;
      border-radius: 12px 12px 0 0;
      padding: 32px 32px 24px;
      text-align: center;
    }
    .login-body { padding: 28px 32px 32px; }
    .form-control:focus { border-color: var(--who-blue); box-shadow: 0 0 0 .2rem rgba(0,147,213,.25); }
    .btn-login {
      background: var(--who-blue); color: white; border: none;
      padding: 10px; font-size: 1rem; font-weight: 600;
    }
    .btn-login:hover { background: var(--who-dark); color: white; }
    .role-badge { font-size: .7rem; padding: 2px 7px; border-radius: 20px; }
  </style>
</head>
<body>
  <div class="login-card card">
    <div class="login-header">
      <div style="font-size:2.8rem; margin-bottom:8px;">🏥</div>
      <h4 class="mb-1 fw-bold">WHO EOC</h4>
      <div style="font-size:.85rem; color:#a0c4e8;">EVD Response — DRC</div>
      <div style="font-size:.8rem; color:#cce5f5; margin-top:6px;">Data Management System</div>
    </div>

    <div class="login-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category == 'danger' else 'info' }} alert-dismissible fade show py-2">
            <i class="bi bi-{{ 'exclamation-circle' if category == 'danger' else 'info-circle' }} me-1"></i>
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endwith %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Email address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" class="form-control" placeholder="you@organization.org"
                   required autofocus autocomplete="email">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" id="passwordInput" class="form-control"
                   placeholder="Enter your password" required autocomplete="current-password">
            <button class="btn btn-outline-secondary" type="button"
                    onclick="togglePassword()" title="Show/hide password">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <div class="mb-4 d-flex align-items-center">
          <input class="form-check-input me-2" type="checkbox" name="remember" id="remember">
          <label class="form-check-label text-muted small" for="remember">Remember me</label>
        </div>

        <button type="submit" class="btn btn-login w-100 rounded-3">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>

      <hr class="my-3">
      <div class="text-center">
        <small class="text-muted">
          <i class="bi bi-shield-lock me-1"></i>
          Role-based access &nbsp;·&nbsp;
          <span class="role-badge bg-danger text-white">Admin</span>
          <span class="role-badge bg-primary text-white ms-1">Editor</span>
          <span class="role-badge bg-secondary text-white ms-1">Viewer</span>
        </small>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePassword() {
      const input = document.getElementById("passwordInput");
      const icon = document.getElementById("eyeIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.className = "bi bi-eye-slash";
      } else {
        input.type = "password";
        icon.className = "bi bi-eye";
      }
    }
  </script>
</body>
</html>
