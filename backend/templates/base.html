<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}WHO EVD Data Management{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --who-blue:#0093D5; --who-dark:#003D6B; }
    body { background:#f4f6f9; }
    .sidebar {
      min-height:100vh; background:var(--who-dark);
      width:220px; position:fixed; top:0; left:0; padding-top:20px; z-index:100;
    }
    .sidebar .nav-link { color:#a0c4e8; padding:10px 20px; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active {
      background:var(--who-blue); color:white;
    }
    .sidebar-brand {
      color:white; text-align:center; padding:10px 20px 20px;
      border-bottom:1px solid #1a5276; margin-bottom:10px;
    }
    .main-content { margin-left:220px; padding:28px 32px; }
    .page-header { border-left:4px solid var(--who-blue); padding-left:12px; margin-bottom:24px; }
    .btn-who { background:var(--who-blue); color:white; border:none; }
    .btn-who:hover { background:var(--who-dark); color:white; }
    .table th { background:#f8f9fa; font-size:.85rem; text-transform:uppercase; letter-spacing:.04em; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-brand">
      <div style="font-size:2rem;">🏥</div>
      <div style="font-weight:800;font-size:1.05rem;">WHO EOC</div>
      <div style="font-size:.72rem;color:#a0c4e8;">EVD Response — DRC</div>
    </div>
    <nav class="nav flex-column">
      <a class="nav-link {% if active_page == 'partners' %}active{% endif %}"
         href="{{ url_for('partners_view.list_partners') }}">
        <i class="bi bi-people me-2"></i>Partners
      </a>
      <a class="nav-link {% if active_page == 'resources' %}active{% endif %}"
         href="{{ url_for('resources_view.list_resources') }}">
        <i class="bi bi-box-seam me-2"></i>Resources
      </a>
      <a class="nav-link {% if active_page == 'activities' %}active{% endif %}"
         href="{{ url_for('activities_view.list_activities') }}">
        <i class="bi bi-geo-alt me-2"></i>Activities
      </a>
      <a class="nav-link {% if active_page == 'sitreps' %}active{% endif %}"
         href="{{ url_for('sitreps_view.list_sitreps') }}">
        <i class="bi bi-file-text me-2"></i>Situation Reports
      </a>
      <hr style="border-color:#1a5276;margin:10px 20px;">
      <a class="nav-link" href="http://localhost:8501" target="_blank">
        <i class="bi bi-bar-chart me-2"></i>Visualizations ↗
      </a>
    </nav>
  </div>

  <div class="main-content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
