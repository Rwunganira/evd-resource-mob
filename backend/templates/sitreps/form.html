{% extends "base.html" %}
{% set active_page = "sitreps" %}
{% block title %}New Situation Report — WHO EVD{% endblock %}

{% block content %}
<div class="page-header">
  <h2 class="mb-0">
    <i class="bi bi-file-earmark-plus me-2"></i>New Situation Report
  </h2>
</div>

<div class="card" style="max-width:800px;">
  <div class="card-body">
    <form method="post">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label fw-semibold">Report Date</label>
          <input type="date" name="report_date" class="form-control"
                 value="{{ today.isoformat() }}">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Outbreak Day <span class="text-danger">*</span></label>
          <input type="number" name="outbreak_day" class="form-control" required min="1" step="1">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Created By</label>
          <input type="text" name="created_by" class="form-control" value="WHO EOC">
        </div>

        <div class="col-12"><hr class="my-1"><p class="fw-semibold mb-0">Epidemiology</p></div>

        <div class="col-md-3">
          <label class="form-label">Confirmed Cases</label>
          <input type="number" name="confirmed_cases" class="form-control" min="0" value="0">
        </div>
        <div class="col-md-3">
          <label class="form-label">Deaths</label>
          <input type="number" name="deaths" class="form-control" min="0" value="0">
        </div>
        <div class="col-md-3">
          <label class="form-label">HCW Affected</label>
          <input type="number" name="healthcare_workers_affected" class="form-control" min="0" value="0">
        </div>
        <div class="col-md-3">
          <label class="form-label">ETUs Operational</label>
          <input type="number" name="etus_operational" class="form-control" min="0" value="0">
        </div>

        <div class="col-12"><hr class="my-1"><p class="fw-semibold mb-0">Funding</p></div>

        <div class="col-md-6">
          <label class="form-label">Total Funding Mobilized (USD)</label>
          <input type="number" name="total_funding_mobilized" class="form-control" min="0" step="10000" value="0">
        </div>
        <div class="col-md-6">
          <label class="form-label">Funding Gap (USD)</label>
          <input type="number" name="funding_gap" class="form-control" min="0" step="10000" value="0">
        </div>

        <div class="col-12">
          <label class="form-label fw-semibold">Notes / Key Messages</label>
          <textarea name="notes" class="form-control" rows="3" placeholder="Key updates, decisions, concerns..."></textarea>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-who">
          <i class="bi bi-check-circle me-1"></i>Submit SitRep
        </button>
        <a href="{{ url_for('sitreps_view.list_sitreps') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
